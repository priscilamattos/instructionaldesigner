const DATA={"title": "FHA Loan Essentials", "subtitle": "A confident first conversation", "reviewed": "November 8, 2026", "scope": "Introductory training for Mortgage Loan Officers on a standard FHA-insured purchase mortgage for a principal residence. Other FHA programs, detailed underwriting, and lender-specific overlays are outside this sample.", "sources": [{"name": "HUD: FHA consumer factsheet", "url": "https://www.hud.gov/hud-partners/single-family-sfh203b", "use": "FHA insures lender-made mortgages, low down payment, principal residence."}, {"name": "HUD: Handbook 4000.1 information page", "url": "https://www.hud.gov/hudclips/handbooks/housing", "use": "Verify applicable policy, documentation, and effective dates."}, {"name": "HUD: Mortgage insurance premium structure FAQ", "url": "https://answers.hud.gov/FHA/s/article/What-is-the-FHA-Mortgage-Insurance-Premium-structure-for-forward-mortgage-loans", "use": "Most FHA programs have upfront MIP and annual MIP paid in monthly installments."}, {"name": "HUD: 2026 FHA loan limits", "url": "https://www.hud.gov/news/hud-no-25-145", "use": "Loan limits vary by area and property units; verify the applicable case-number year."}], "decisions": [{"title": "The down payment question", "quote": "Alex says: ‘The home is $300,000 and I saved $10,500. Does that mean I have enough to close?’", "context": "Training assumption: adjusted value is $300,000 and the borrower is eligible for 3.5% minimum investment. No closing-cost estimate has been prepared.", "prompt": "What is the best response?", "correct": 0, "choices": ["‘That is 3.5% in this example. Let’s review closing costs, prepaids, funding sources, and your lender’s requirements before estimating the total.’", "‘Yes. You have the 3.5% down payment, so $10,500 covers the entire transaction.’"], "feedback": [{"title": "Alex understands there is more to estimate.", "body": "You separated the illustrative minimum investment from total cash needed. Costs, eligible credits, financing choices, and the borrower’s file must be verified before quoting cash to close.", "takeaway": "A minimum down payment is one part of the transaction."}, {"title": "Alex now assumes no other funds are needed.", "body": "The minimum investment is not a complete cash-to-close figure. Your answer could leave Alex unprepared for closing costs and prepaid items.", "takeaway": "Explain the cost categories before giving a total."}]}, {"title": "The property-use question", "quote": "Alex says: ‘I plan to keep living where I am and rent this house out from day one.’", "context": "The conversation concerns a standard FHA purchase mortgage for a principal residence.", "prompt": "What should you do next?", "correct": 1, "choices": ["‘As long as you can make the payment, we can treat it as your primary home.’", "‘Let’s document how you actually plan to use the property and confirm the appropriate program with our team.’"], "feedback": [{"title": "The application could misstate the intended use.", "body": "Ability to make the payment does not make a rental property a principal residence. Do not alter the stated purpose to fit a program.", "takeaway": "Document the intended use accurately."}, {"title": "The program question goes to the right review.", "body": "You identified a mismatch between the stated use and the standard principal-residence purchase scope. Record the facts and seek the appropriate program review without promising eligibility.", "takeaway": "Clarify the facts before discussing program fit."}]}, {"title": "A different property", "quote": "Alex later asks about a home they would occupy in a different county: ‘Can we use the same loan limit and payment estimate?’", "context": "The property and county changed. The applicable case-number year and lender review still need confirmation.", "prompt": "What is the best next step?", "correct": 0, "choices": ["‘We need to verify the new county’s limit, property units, applicable year, and updated costs, including mortgage insurance, before confirming an estimate.’", "‘Yes. FHA has one national limit, and mortgage insurance works the same for every loan.’"], "feedback": [{"title": "Alex gets an accurate next step.", "body": "You identified the items that need rechecking. FHA limits depend on location and units, while mortgage insurance details and other costs must be verified for the specific loan.", "takeaway": "A property change can require a new review."}, {"title": "The estimate rests on two unsupported assumptions.", "body": "There is no single limit for every property. Most FHA programs include upfront and annual MIP, but the applicable amount and duration require verification.", "takeaway": "Verify current limits and mortgage insurance details."}]}], "quiz": [{"q": "Who makes an FHA-insured mortgage?", "choices": ["FHA directly lends the money.", "An FHA-approved lender makes the loan; FHA provides mortgage insurance.", "The county government automatically funds it."], "correct": 1, "why": "FHA insures eligible mortgages made by approved lenders. It is not the lender in this transaction."}, {"q": "For an eligible borrower in this example, adjusted value is $300,000 and minimum investment is 3.5%. What is the investment?", "choices": ["$3,500", "$30,000", "$10,500"], "correct": 2, "why": "$300,000 × 0.035 = $10,500. This is an illustrative minimum investment, not the total cash needed to close."}, {"q": "Alex plans to rent the home out immediately and will not live there. What should the MLO do?", "choices": ["Document the actual intended use and seek appropriate program review.", "Mark it as a principal residence so it fits the program.", "Treat the down payment as proof of eligibility."], "correct": 0, "why": "The sample covers a standard principal-residence FHA purchase. The intended use must be recorded accurately and reviewed for appropriate program fit."}, {"q": "Which cost explanation is most accurate for a standard FHA purchase discussion?", "choices": ["The down payment is always the entire amount due at closing.", "Discuss the down payment, other closing items, and applicable upfront and annual mortgage insurance.", "Mortgage insurance can be omitted whenever the customer asks."], "correct": 1, "why": "The down payment does not describe every transaction cost. Most FHA programs include upfront MIP and annual MIP collected monthly; verify amounts and duration."}, {"q": "The customer chooses a home in another county. What must you verify before confirming the limit?", "choices": ["Only the customer’s preferred payment.", "A limit from an old loan in another area.", "The property’s county, unit count, and applicable FHA case-number year."], "correct": 2, "why": "FHA limits vary by area and units and are published for applicable years. Check current HUD resources and lender requirements."}]};

const KEY='pm-fha-essentials-burgundy-v2';const clean=()=>({step:0,visited:[],practice:0,picks:[null,null,null],qi:0,answers:[],done:false});

const main=document.getElementById('lesson'),nav=document.getElementById('nav');const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}};const el=(s)=>document.querySelector(s);const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);

function welcome(){shell('01 / START HERE','A confident first conversation.',`<p class="lead">A borrower asks, “Can I buy this home with an FHA loan?” Practice explaining the basics and identifying what to verify before you answer.</p><div class="hero-banner"><strong>MEET YOUR BORROWER</strong><p>“I’ve saved for a down payment. What happens next?”</p></div><div class="stat-row"><span class="pill">Mortgage Loan Officers</span><span class="pill">10–12 minutes</span><span class="pill">5-question quiz</span></div><div class="panel"><h2>By the end, you can…</h2><ol class="objectives"><li>Explain who lends the money and what FHA insures.</li><li>Distinguish an illustrative minimum investment from total cash needed.</li><li>Choose a sound next step when property use or loan details need review.</li></ol></div><p class="small">Scope: standard FHA-insured purchase for a principal residence. This concept is introductory training, not an underwriting decision tool. Your progress stays in this browser; no LMS reporting is included.</p>`);next('Begin the Lesson →',()=>go(1));}
const tabs=[['Who Does What?','The lender lends. FHA insures.','An FHA-approved lender makes the mortgage. FHA provides mortgage insurance on eligible loans, helping protect the lender if the borrower defaults. FHA is not directly lending the money in this transaction.','“We can explore an FHA-insured option with our lending team.”'],['Property Use','Start with how the home will be used.','This lesson covers a standard FHA purchase mortgage for a principal residence. Ask about intended occupancy. A home the customer plans to rent out from day one while living elsewhere needs an appropriate program review. Record the actual facts.','“How do you plan to use this home?”'],['What to Verify','A program option is not an approval.','Review credit, income, debts, assets, funding sources, and property requirements under current HUD policy and lender criteria. Check the property’s county, unit count, and applicable FHA case-number year before confirming a loan limit.','“Let’s verify the requirements for your file and this property.”']];let tab=0;
function basics(){shell('02 / FHA BASICS','A clear role. A verified next step.',`<p class="lead">Explore the three foundations of an accurate FHA conversation.</p><div class="panel"><div class="tabs" aria-label="Explore FHA basics">${tabs.map((t,i)=>`<button data-tab="${i}" aria-pressed="${i===tab}">${t[0]}</button>`).join('')}</div><div class="tab-content" id="tab-panel"></div></div><p class="small">Current HUD policy, effective dates, and lender requirements determine transaction-specific eligibility.</p>`);showTab();main.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);basics();el(`[data-tab="${tab}"]`).focus();});next('Explore the Costs →',()=>go(2));}
function showTab(){const t=tabs[tab];el('#tab-panel').innerHTML=`<h2>${t[1]}</h2><p>${t[2]}</p><div class="callout"><p><strong>Try saying</strong><br>${t[3]}</p></div>`;}
function cost(){shell('03 / THE COST CONVERSATION','The down payment is one part.',`<p class="lead">Eligible borrowers may have a minimum investment as low as 3.5%. That number does not tell the whole closing-cost story.</p><div class="panel"><p class="kicker">ILLUSTRATIVE MINIMUM INVESTMENT</p><label class="range-label" for="value">Assumed adjusted value <select id="value"><option value="250000">$250,000</option><option value="300000" selected>$300,000</option><option value="350000">$350,000</option></select></label><p class="math" id="math" aria-live="polite"></p><p class="small">Assumes eligibility for 3.5% minimum investment. These examples exclude other closing items and do not establish eligibility, approval, or total cash to close.</p></div><h2>Explain three cost categories</h2><p><strong>Down payment:</strong> Verify the applicable minimum investment and acceptable funding sources.</p><p><strong>Other closing items:</strong> Review lender estimates for closing costs, prepaids, and other required funds. Verify credits and financing treatment.</p><p><strong>Mortgage insurance:</strong> Most FHA programs include upfront mortgage insurance premium (MIP) and annual MIP collected monthly. Verify the amount, financing treatment, and duration for the specific loan.</p><div class="callout"><p><strong>Instead of quoting a total from the down payment alone:</strong><br>“Let’s review the other costs and requirements before estimating what you’ll need to close.”</p></div>`);const update=()=>{const v=Number(el('#value').value);el('#math').textContent=money(v)+' × 3.5% = '+money(v*.035);};el('#value').onchange=update;update();next('Practice With Alex →',()=>go(3));}
function practice(){const i=Math.min(state.practice,2),d=DATA.decisions[i],pick=state.picks[i];shell(`04 / PRACTICE · DECISION ${i+1} OF 3`,d.title,`<div class="quote">${esc(d.quote)}</div><p class="small">${esc(d.context)}</p><h3>${esc(d.prompt)}</h3><div class="choices">${d.choices.map((t,j)=>`<button class="choice" data-choice="${j}" aria-pressed="${pick===j}" ${pick!==null?'disabled':''}><b>${String.fromCharCode(65+j)}</b><span>${esc(t)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div>`);main.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.picks[i]=Number(b.dataset.choice);save();practice();el('#feedback').scrollIntoView({block:'nearest'});});if(pick!==null){const ok=pick===d.correct,f=d.feedback[pick];el('#feedback').innerHTML=`<div class="feedback ${ok?'':'coach'}"><p class="kicker">${ok?'STRONG RESPONSE':'COACHING RESPONSE'}</p><h2>${esc(f.title)}</h2><p>${esc(f.body)}</p><p><strong>${esc(f.takeaway)}</strong></p></div>`;if(ok)next(i===2?'Begin the Knowledge Check →':'Next Decision →',()=>{if(i<2){state.practice=i+1;save();practice();main.focus();}else go(4);},['Try This Decision Again',()=>{state.picks[i]=null;save();practice();}]);else next('Try This Decision Again',()=>{state.picks[i]=null;save();practice();main.focus();});}}
function quiz(){if(state.done){results();return;}const i=Math.min(state.qi,4),q=DATA.quiz[i],answered=Number.isInteger(state.answers[i]);shell(`05 / KNOWLEDGE CHECK · QUESTION ${i+1} OF 5`,'Check your understanding.',`<p class="small">Choose one answer. Feedback appears immediately. Pass mark: 80% (4 of 5). You can retry the quiz after reviewing your results.</p><div class="panel"><h2 style="font-size:26px">${esc(q.q)}</h2><div class="choices">${q.choices.map((t,j)=>`<button class="choice" data-answer="${j}" aria-pressed="${state.answers[i]===j}" ${answered?'disabled':''}><b>${String.fromCharCode(65+j)}</b><span>${esc(t)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div></div>`);main.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers[i]=Number(b.dataset.answer);save();quiz();el('#feedback').scrollIntoView({block:'nearest'});});if(answered){const ok=state.answers[i]===q.correct;el('#feedback').innerHTML=`<div class="feedback ${ok?'':'coach'}"><h3>${ok?'Correct':'Review This Point'}</h3><p>${esc(q.why)}</p><p><strong>Best answer:</strong> ${esc(q.choices[q.correct])}</p></div>`;next(i===4?'See Your Results →':'Next Question →',()=>{if(i===4){state.done=true;save();go(5);}else{state.qi=i+1;save();quiz();main.focus();}});}}
function retry(){state.qi=0;state.answers=[];state.done=false;save();go(4);}
function results(){if(!state.done){shell('06 / YOUR RESULTS','Your results will appear here.',`<p class="lead">Complete the five-question knowledge check to see your score and answer review.</p><p>Review the basics or practice decisions whenever you need them.</p>`);next('Go to the Knowledge Check →',()=>go(4));return;}const count=DATA.quiz.filter((q,i)=>state.answers[i]===q.correct).length,pct=count*20;shell('06 / YOUR RESULTS',pct>=80?'Ready for the next conversation.':'A useful place to keep practicing.',`<div class="panel"><p class="results-score">${pct}%</p><h3>${count} of 5 correct · ${pct>=80?'Pass':'Keep Practicing'}</h3><p>${pct>=80?'You met this sample’s 80% knowledge-check threshold. Use the job aid to support a clear first conversation.':'Review the explanations below, revisit the lesson, and try again. The pass mark is 4 of 5.'}</p><p class="small">This result checks the learning points in this sample. It does not certify lending or underwriting competence.</p><a class="btn" href="FHA_Loan_Job_Aid.pdf" target="_blank" rel="noopener">Open the Job Aid ↗</a></div><h2>Your answer review</h2>${DATA.quiz.map((q,i)=>`<article class="review"><p class="tag">QUESTION ${i+1} · ${state.answers[i]===q.correct?'CORRECT':'REVIEW'}</p><h3>${esc(q.q)}</h3><p><strong>Your answer:</strong> ${esc(q.choices[state.answers[i]])}</p><p><strong>Best answer:</strong> ${esc(q.choices[q.correct])}</p><p>${esc(q.why)}</p></article>`).join('')}`);next('Retry the Quiz',retry,['Review FHA Basics',()=>go(1)]);}
function sources(){shell('REFERENCE / SCOPE & SOURCES','Verify before you quote.',`<p class="lead">${esc(DATA.scope)}</p><div class="callout"><p>Use current Handbook 4000.1, applicable Mortgagee Letters, policy effective dates, and lender requirements before operational use. Specific credit thresholds, mortgage insurance rates, and numeric loan limits are intentionally not quoted here.</p></div><ol class="sources">${DATA.sources.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a><br>${esc(s.use)}</li>`).join('')}</ol><p class="small">Reviewed ${DATA.reviewed}. Independent, AI-assisted instructional design portfolio concept by Priscila Mattos. No government affiliation, client implementation, or measured workplace outcomes are claimed.</p>`);next('Back to the Lesson',()=>go(state.step));main.focus();}
document.getElementById('source-btn').onclick=sources;document.getElementById('home').onclick=e=>{e.preventDefault();go(0);};document.getElementById('reset').onclick=()=>{if(confirm('Reset lesson progress, practice responses, and quiz answers in this browser?')){state=clean();go(0);}};go(state.step,false);
</script></body></html>
